<!doctype html>
<html>

<x-dc>

<div style="width: 1200px; height: 740px; box-sizing: border-box; background: #FFFFFF; padding: 56px 64px; display: flex; flex-direction: column; gap: 44px">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">

      <svg width="84" height="84" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg>
      <span style="font-family: Sora, 'Avenir Next', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 76px; letter-spacing: -2.00px; line-height: 1; color: #000000">Renqun</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-bottom: 6px">
      <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 22px; color: #171717; letter-spacing: 2px">人群</span>
      <span class="label">rénqún · a crowd</span>
    </div>
  </div>

  <div style="height: 1px; background: rgba(23,23,23,0.08)"></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; flex-grow: 1">
    <div style="display: flex; flex-direction: column; gap: 18px">
      <span class="label">App icon</span>
      <div style="display: flex; align-items: flex-end; gap: 28px">
        <div style="width: 256px; height: 256px; border-radius: 57.3px; background: #F4F0ED; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 10px 22px rgba(90,52,24,0.10);"><div style="margin-top: -6.1px"><svg width="154" height="154" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg></div></div>
        <div style="display: flex; flex-direction: column; gap: 22px; align-items: flex-start">

          <div style="display: flex; align-items: flex-end; gap: 16px"><div style="width: 60px; height: 60px; border-radius: 13.4px; background: #F4F0ED; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 10px 22px rgba(90,52,24,0.10);"><div style="margin-top: -1.4px"><svg width="36" height="36" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg></div></div><div style="width: 40px; height: 40px; border-radius: 8.9px; background: #F4F0ED; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 10px 22px rgba(90,52,24,0.10);"><div style="margin-top: -1.0px"><svg width="24" height="24" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg></div></div><div style="width: 29px; height: 29px; border-radius: 6.5px; background: #F4F0ED; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 10px 22px rgba(90,52,24,0.10);"><div style="margin-top: -0.7px"><svg width="17" height="17" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg></div></div></div>
        </div>
      </div>
      <span class="label" style="margin-top: 12px">Mark alone, down to 20px</span>
      <div style="display: flex; align-items: flex-end; gap: 28px"><svg width="64" height="64" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg><svg width="40" height="40" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg><svg width="28" height="28" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg><svg width="20" height="20" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px">
      <span class="label">Where it comes from</span>
      <div style="display: flex; align-items: center; gap: 18px; padding: 22px 26px; border-radius: 18px; background: #F7F4F1">
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 64px; line-height: 1; color: #171717">人</span>
        <svg width="20" height="20" viewBox="0 0 20 20" style="display: block; flex-shrink: 0"><path d="M4 10h11M11 6l4 4-4 4" stroke="#8A837D" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <svg width="72" height="72" viewBox="56 10 128 128" xmlns="http://www.w3.org/2000/svg" style="display: block"><path d="M78 122L120 62L162 122" stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"></path><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg>
        <svg width="20" height="20" viewBox="0 0 20 20" style="display: block; flex-shrink: 0"><path d="M4 10h11M11 6l4 4-4 4" stroke="#8A837D" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 64px; line-height: 1; color: #171717">众</span>
        <svg width="20" height="20" viewBox="0 0 20 20" style="display: block; flex-shrink: 0"><path d="M4 10h11M11 6l4 4-4 4" stroke="#8A837D" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <svg width="72" height="72" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg>
      </div>
      <p style="margin: 0; max-width: 470px; font-size: 15px; line-height: 22px; color: #545454; text-wrap: pretty">人 is a person. Three of them, stacked, is 众: a crowd. Stacked, they also point up. The red dot is the one who calls it first.</p>

      <span class="label" style="margin-top: 18px">In the app’s top bar, actual size</span>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 20px; border-radius: 18px; background: #F4F0ED">
        <div style="display: flex; align-items: center; gap: 8px"><svg width="26" height="26" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg><span style="font-family: Sora, 'Avenir Next', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.50px; line-height: 1; color: #000000">Renqun</span></div>
        <div style="display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 4px 0 14px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 3px 8px rgba(90,52,24,0.07)">
          <span style="font-family: 'JetBrains Mono', Menlo, monospace; font-weight: 700; font-size: 13px; color: #171717">20.00</span>
          <span style="font-family: Inter, sans-serif; font-weight: 500; font-size: 12px; color: #6B6B6B; margin-right: 4px">MUSD</span>
          <div style="width: 28px; height: 28px; border-radius: 14px; background: #FF004D; display: flex; align-items: center; justify-content: center">
            <svg width="12" height="12" viewBox="0 0 12 12" style="display: block"><path d="M6 1.5v9M1.5 6h9" stroke="#000000" stroke-width="2.2" stroke-linecap="round"></path></svg>
          </div>
        </div>
      </div>

      <span class="label" style="margin-top: 18px">Lockup</span>
      <div style="display: flex; align-items: center; gap: 14px"><svg width="44" height="44" viewBox="8 4 224 224" xmlns="http://www.w3.org/2000/svg" style="display: block; flex-shrink: 0"><g stroke="#171717" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M78 122L120 62L162 122"></path><path d="M20 206L62 146L104 206"></path><path d="M136 206L178 146L220 206"></path></g><circle cx="120" cy="29" r="14" fill="#FF004D"></circle></svg><span style="font-family: Sora, 'Avenir Next', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.89px; line-height: 1; color: #000000">Renqun</span></div>
    </div>
  </div>
</div>
