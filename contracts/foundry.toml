[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Mezo's developer docs pin London. The chain itself runs through Osaka (mezod v11+), but
# London keeps the bytecode valid on every Mezo node and explorer verifier.
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 200
fail_on_revert = true

[rpc_endpoints]
mezo_mainnet = "https://mainnet.mezo.public.validationcloud.io"
mezo_testnet = "https://rpc.test.mezo.org"

# Verification: Mezo explorers are Blockscout. Pass
#   --verify --verifier blockscout --verifier-url https://api.explorer.test.mezo.org/api
# (mainnet: https://api.explorer.mezo.org/api). Foundry has no built-in entry for chains 31611/31612.
